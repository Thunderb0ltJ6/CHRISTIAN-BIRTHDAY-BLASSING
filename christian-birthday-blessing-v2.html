<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christian Birthday Blessing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── CSS Variables ─────────────────────────────── */
:root {
  --gold:       #b8942a;
  --gold-l:     #d4af60;
  --gold-xl:    #f0dfa0;
  --gold-s:     #8a6d1a;
  --ivory:      #fdf9f0;
  --parch:      #f5edda;
  --cream:      #fffdf7;
  --navy:       #1a2240;
  --ink:        #23200f;
  --muted:      #7a6a45;
  --border:     #e0d4b8;
  --card-bg:    #ffffff;
  --input-bg:   #fefcf5;
  --shadow:     0 8px 40px rgba(90,60,10,0.10), 0 2px 8px rgba(184,148,42,0.10);
  --shadow-lg:  0 20px 60px rgba(90,60,10,0.14), 0 4px 16px rgba(184,148,42,0.13);
  --body-bg:    var(--ivory);
  --text:       var(--ink);
  --text-m:     var(--muted);
  --divider:    var(--border);
  --topbar-bg:  rgba(253,249,240,0.90);
  --verse-bg:   linear-gradient(135deg,rgba(184,148,42,0.07),rgba(212,175,96,0.04));
  --verse-bdr:  rgba(184,148,42,0.28);
}
[data-theme="dark"] {
  --gold:       #c9a84c;
  --gold-l:     #dfc07a;
  --gold-xl:    #f0dfa0;
  --gold-s:     #9a7a2e;
  --ivory:      #12100a;
  --parch:      #1c190e;
  --cream:      #0e0c07;
  --navy:       #c5d0f0;
  --ink:        #f0e8d0;
  --muted:      #a08c65;
  --border:     #3a3018;
  --card-bg:    #1c190e;
  --input-bg:   #252010;
  --shadow:     0 8px 40px rgba(0,0,0,0.45), 0 2px 8px rgba(201,168,76,0.10);
  --shadow-lg:  0 20px 60px rgba(0,0,0,0.55), 0 4px 16px rgba(201,168,76,0.12);
  --body-bg:    #12100a;
  --text:       #f0e8d0;
  --text-m:     #a08c65;
  --divider:    #3a3018;
  --topbar-bg:  rgba(18,16,10,0.92);
  --verse-bg:   linear-gradient(135deg,rgba(201,168,76,0.09),rgba(201,168,76,0.03));
  --verse-bdr:  rgba(201,168,76,0.28);
}

/* ── Reset & Base ──────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Raleway',sans-serif;
  background:var(--body-bg);
  color:var(--text);
  min-height:100vh;
  transition:background .4s,color .4s;
  overflow-x:hidden;
}

/* ── Background ambient layer ──────────────────── */
.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.amb-orb{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,var(--gold-xl) 0%,transparent 70%);
  opacity:0;
  animation:orbFloat var(--d) ease-in-out infinite alternate;
}
[data-theme="dark"] .amb-orb{opacity:0.06;}
[data-theme="light"] .amb-orb{opacity:0.25;}
@keyframes orbFloat{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(var(--tx),var(--ty)) scale(1.12);}
}
.cross-bg{
  position:absolute;
  font-size:var(--fs);color:var(--gold);
  opacity:0;pointer-events:none;user-select:none;
  animation:crossDrift var(--d) ease-in-out infinite alternate;
}
[data-theme="dark"] .cross-bg{opacity:0.055;}
[data-theme="light"] .cross-bg{opacity:0.04;}
@keyframes crossDrift{
  from{transform:rotate(var(--r0));}
  to{transform:rotate(var(--r1)) translateY(12px);}
}

/* ── Topbar ────────────────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 28px;
  background:var(--topbar-bg);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--divider);
  transition:background .4s,border-color .4s;
}
.brand{
  font-family:'Playfair Display',serif;
  font-size:1.05rem;font-weight:600;
  color:var(--gold);
  display:flex;align-items:center;gap:9px;
  letter-spacing:.04em;
}
.brand-sym{font-size:1.4rem;line-height:1;}
.theme-toggle{
  background:none;
  border:1.5px solid var(--divider);
  border-radius:30px;padding:7px 17px;
  font-family:'Raleway',sans-serif;
  font-size:.78rem;font-weight:700;letter-spacing:.05em;
  color:var(--text-m);cursor:pointer;
  display:flex;align-items:center;gap:8px;
  transition:border-color .2s,color .2s;
}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold);}

/* ── Main wrapper ──────────────────────────────── */
.page{
  position:relative;z-index:10;
  min-height:100vh;
  padding:96px 18px 70px;
  display:flex;flex-direction:column;align-items:center;
}

/* ── Hero ──────────────────────────────────────── */
.hero{
  text-align:center;max-width:620px;
  margin-bottom:40px;
}
.hero-cake{
  display:block;font-size:3.4rem;
  animation:cakeFloat 3.2s ease-in-out infinite;
  margin-bottom:4px;
}
@keyframes cakeFloat{
  0%,100%{transform:translateY(0) rotate(-4deg);}
  50%{transform:translateY(-11px) rotate(4deg);}
}
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.75rem,5.5vw,3rem);
  font-weight:700;
  background:linear-gradient(135deg,var(--gold-s),var(--gold),var(--gold-l),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 2px 12px rgba(184,148,42,.22));
  line-height:1.18;margin-bottom:12px;
  letter-spacing:.02em;
}
.hero-verse{
  font-family:'EB Garamond',serif;
  font-style:italic;font-size:clamp(.95rem,2.3vw,1.15rem);
  color:var(--text-m);font-weight:400;
  line-height:1.65;margin-bottom:6px;
}
.hero-ref{
  font-family:'Raleway',sans-serif;
  font-size:.75rem;font-weight:700;
  letter-spacing:.1em;color:var(--gold);
  text-transform:uppercase;
}
.rule{
  display:flex;align-items:center;gap:14px;
  max-width:340px;margin:18px auto 0;
  color:var(--gold);opacity:.5;font-size:.8rem;
}
.rule::before,.rule::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* ── Input Card ────────────────────────────────── */
.input-card{
  background:var(--card-bg);
  border:1px solid var(--divider);
  border-radius:22px;
  padding:36px 38px 34px;
  width:100%;max-width:560px;
  box-shadow:var(--shadow);
  margin-bottom:30px;
  position:relative;overflow:hidden;
  transition:background .4s,border-color .4s,box-shadow .4s;
}
.input-card::after{
  content:'✝';position:absolute;
  bottom:-20px;right:-8px;
  font-size:130px;color:var(--gold);
  opacity:0.035;pointer-events:none;line-height:1;
}
.field-label{
  display:block;
  font-family:'Raleway',sans-serif;
  font-size:.68rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-m);margin-bottom:9px;
}
.name-input{
  width:100%;
  padding:14px 18px;
  border:1.5px solid var(--divider);
  border-radius:12px;
  font-family:'EB Garamond',serif;
  font-size:1.28rem;
  color:var(--text);
  background:var(--input-bg);
  outline:none;
  transition:border-color .3s,box-shadow .3s,background .4s;
  margin-bottom:18px;
}
.name-input::placeholder{color:var(--text-m);opacity:.55;}
.name-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(184,148,42,.15);
}
.name-input.shake{animation:shake .4s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
.btn-gen{
  width:100%;padding:15px 20px;
  background:linear-gradient(135deg,var(--gold-s) 0%,var(--gold) 40%,var(--gold-l) 70%,var(--gold) 100%);
  background-size:220% 220%;
  animation:shimmer 5s ease infinite;
  border:none;border-radius:12px;
  font-family:'Playfair Display',serif;
  font-size:1.05rem;font-weight:600;
  letter-spacing:.06em;
  color:#1a1200;
  cursor:pointer;
  box-shadow:0 6px 28px rgba(184,148,42,.38);
  transition:transform .2s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
@keyframes shimmer{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(184,148,42,.52);}
.btn-gen:active{transform:scale(.98);}

/* ── Blessing card ─────────────────────────────── */
.blessing-card{
  background:var(--card-bg);
  border:1px solid var(--divider);
  border-radius:26px;
  padding:46px 46px 38px;
  width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);
  display:none;
  opacity:0;transform:translateY(28px) scale(.98);
  transition:opacity .65s cubic-bezier(.34,1.3,.64,1),
              transform .65s cubic-bezier(.34,1.3,.64,1),
              background .4s,border-color .4s;
  position:relative;overflow:hidden;
}
.blessing-card.open{display:block;}
.blessing-card.shown{opacity:1;transform:translateY(0) scale(1);}

/* corner flourishes */
.flourish{
  position:absolute;
  font-size:52px;color:var(--gold);
  opacity:0.08;pointer-events:none;line-height:1;
}
.fl-tl{top:12px;left:16px;}
.fl-tr{top:12px;right:16px;transform:scaleX(-1);}
.fl-bl{bottom:12px;left:16px;transform:scaleY(-1);}
.fl-br{bottom:12px;right:16px;transform:scale(-1,-1);}

/* candle row */
.candle-row{
  display:flex;justify-content:center;gap:10px;
  margin-bottom:18px;
}
.candle-w{display:flex;flex-direction:column;align-items:center;}
.flame{
  width:9px;height:14px;
  background:radial-gradient(ellipse at 50% 70%,#ffe566,#f97316 55%,transparent);
  border-radius:50% 50% 30% 30%;
  animation:flicker var(--fs,0.6s) ease-in-out infinite alternate;
  margin-bottom:0;
}
@keyframes flicker{
  from{transform:scale(1,1) rotate(-3deg);opacity:.9;}
  to{transform:scale(.82,1.12) rotate(3deg);opacity:1;}
}
.candle-b{
  width:10px;height:26px;
  border-radius:3px 3px 1px 1px;
  background:var(--cc);
}
.candle-base{
  width:14px;height:4px;
  border-radius:2px;
  background:rgba(120,100,60,.22);
}
/* wax drip */
.candle-b::after{
  content:'';display:block;
  width:5px;height:6px;
  border-radius:0 0 4px 4px;
  background:var(--cc);
  opacity:.6;margin-left:1px;margin-top:-1px;
}

/* title */
.b-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.4rem,4.5vw,2.05rem);
  font-weight:700;
  color:var(--gold);
  text-align:center;
  margin-bottom:22px;
  line-height:1.25;
  letter-spacing:.02em;
  text-shadow:0 2px 20px rgba(184,148,42,.18);
}
.ornament-line{
  display:flex;align-items:center;gap:14px;
  color:var(--gold);font-size:1rem;
  margin:18px 0;opacity:.55;
}
.ornament-line::before,.ornament-line::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* blessing body */
.b-body{
  font-family:'EB Garamond',serif;
  font-size:clamp(1.1rem,2.4vw,1.32rem);
  font-weight:400;line-height:1.88;
  color:var(--text);text-align:center;
  margin-bottom:24px;
}
.b-name{
  font-weight:600;font-style:italic;
  color:var(--gold);
}

/* verse block */
.verse-block{
  background:var(--verse-bg);
  border:1px solid var(--verse-bdr);
  border-left:4px solid var(--gold);
  border-radius:0 14px 14px 0;
  padding:20px 24px;
  margin:20px 0 26px;
}
.verse-eyebrow{
  font-family:'Raleway',sans-serif;
  font-size:.63rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px;
  display:flex;align-items:center;gap:8px;
}
.verse-text{
  font-family:'EB Garamond',serif;
  font-size:clamp(1.05rem,2.2vw,1.22rem);
  font-style:italic;font-weight:400;
  color:var(--text);line-height:1.72;
  margin-bottom:10px;
}
.verse-ref{
  font-family:'Raleway',sans-serif;
  font-size:.76rem;font-weight:700;
  letter-spacing:.07em;color:var(--gold);
}

/* closing */
.b-closing{
  font-family:'EB Garamond',serif;
  font-size:clamp(1rem,2vw,1.12rem);
  font-style:italic;
  color:var(--text-m);text-align:center;
  line-height:1.72;margin-top:14px;
}

/* action row */
.actions{
  display:flex;flex-wrap:wrap;gap:11px;
  margin-top:28px;justify-content:center;
}
.btn-act{
  display:flex;align-items:center;gap:8px;
  padding:10px 19px;
  border:1.5px solid var(--divider);
  border-radius:10px;
  background:transparent;
  color:var(--text-m);
  font-family:'Raleway',sans-serif;
  font-size:.82rem;font-weight:700;
  letter-spacing:.03em;
  cursor:pointer;
  transition:border-color .2s,color .2s,background .2s,transform .15s;
}
.btn-act:hover{
  border-color:var(--gold);color:var(--gold);
  background:rgba(184,148,42,.07);
  transform:translateY(-1px);
}
.btn-act svg{width:15px;height:15px;flex-shrink:0;}
.btn-act.primary{
  border-color:var(--gold);color:var(--gold);
  background:rgba(184,148,42,.08);
}
.btn-act.primary:hover{background:rgba(184,148,42,.18);}

/* ── Balloons ──────────────────────────────────── */
.balloons{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.bal{
  position:absolute;bottom:-130px;
  display:flex;flex-direction:column;align-items:center;
  animation:balRise var(--dur) ease-in infinite;
  animation-delay:var(--del);opacity:0;
}
.bal-b{
  width:46px;height:58px;
  border-radius:50% 50% 46% 46%;
  background:var(--bc);
  box-shadow:inset -7px -9px 16px rgba(0,0,0,.18),
             inset 3px 3px 10px rgba(255,255,255,.22);
  position:relative;
}
.bal-b::after{
  content:'';position:absolute;
  bottom:-6px;left:50%;transform:translateX(-50%);
  width:7px;height:7px;
  border-radius:50% 50% 50% 50%/0 0 100% 100%;
  background:var(--bc);
}
.bal-s{width:1px;height:56px;background:rgba(160,140,100,.35);}
@keyframes balRise{
  0%{bottom:-130px;opacity:0;transform:translateX(0);}
  4%{opacity:.75;}
  50%{transform:translateX(var(--sw));}
  95%{opacity:.55;}
  100%{bottom:108vh;opacity:0;transform:translateX(calc(var(--sw)*-.6));}
}

/* ── Confetti canvas ───────────────────────────── */
#conf{position:fixed;inset:0;pointer-events:none;z-index:300;}

/* ── Toast ─────────────────────────────────────── */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--gold);color:#1a1200;
  padding:11px 26px;border-radius:50px;
  font-family:'Raleway',sans-serif;
  font-size:.83rem;font-weight:700;letter-spacing:.04em;
  opacity:0;transition:opacity .3s,transform .3s;
  z-index:400;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Responsive ────────────────────────────────── */
@media(max-width:560px){
  .input-card,.blessing-card{padding:26px 20px 22px;}
  .actions{gap:8px;}
  .btn-act{padding:9px 13px;font-size:.76rem;}
  .topbar{padding:12px 16px;}
}
</style>
</head>
<body>
<canvas id="conf"></canvas>

<!-- Ambient background -->
<div class="ambient" id="ambient"></div>
<!-- Balloons -->
<div class="balloons" id="balloons"></div>

<!-- Topbar -->
<header class="topbar">
  <div class="brand">
    <span class="brand-sym">✝</span>
    <span>Birthday Blessings</span>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
    <span id="themeIco">🌙</span>
    <span id="themeTxt">Dark Mode</span>
  </button>
</header>

<!-- Page -->
<main class="page">

  <!-- Hero -->
  <div class="hero">
    <span class="hero-cake">🎂</span>
    <h1 class="hero-title">Christian Birthday Blessing</h1>
    <p class="hero-verse">"The Lord bless you and keep you; the Lord make His face shine on you and be gracious to you."</p>
    <p class="hero-ref">Numbers 6:24–25</p>
    <div class="rule">✦</div>
  </div>

  <!-- Input card -->
  <div class="input-card">
    <label class="field-label" for="nameInput">✦ Birthday Person's Name</label>
    <input id="nameInput" class="name-input" type="text"
           placeholder="Enter their name…" maxlength="60" autocomplete="off"
           onkeydown="if(event.key==='Enter')generate()">
    <button class="btn-gen" onclick="generate()">
      <span>✝</span>
      <span>Generate Birthday Blessing</span>
      <span>🎉</span>
    </button>
  </div>

  <!-- Blessing output -->
  <div class="blessing-card" id="card">
    <div class="flourish fl-tl">❧</div>
    <div class="flourish fl-tr">❧</div>
    <div class="flourish fl-bl">❧</div>
    <div class="flourish fl-br">❧</div>

    <div class="candle-row" id="candles"></div>
    <div class="b-title" id="bTitle"></div>
    <div class="ornament-line">✦ ✝ ✦</div>
    <div class="b-body" id="bBody"></div>
    <div class="verse-block">
      <div class="verse-eyebrow">📖 Scripture</div>
      <div class="verse-text" id="vText"></div>
      <div class="verse-ref" id="vRef"></div>
    </div>
    <div class="b-closing" id="bClosing"></div>
    <div class="actions">
      <button class="btn-act" onclick="copyCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy
      </button>
      <button class="btn-act" onclick="shareCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share
      </button>
      <button class="btn-act" onclick="downloadCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
      <button class="btn-act primary" onclick="generate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        New Blessing
      </button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════
   BIBLE VERSE DATABASE — 120 birthday-appropriate verses
   Only: blessing, joy, love, hope, faith, wisdom,
         gratitude, purpose, growth, protection, peace,
         God's promises, new beginnings, identity in God.
   EXCLUDED: war, judgment, punishment, prophecy of doom,
             suffering, lament.
   ════════════════════════════════════════════════════ */
const VERSES = [
  // ── Blessing & Favor ──────────────────────────
  {t:"The Lord bless you and keep you; the Lord make His face shine on you and be gracious to you; the Lord turn His face toward you and give you peace.",r:"Numbers 6:24–26"},
  {t:"From the fullness of His grace we have all received one blessing after another.",r:"John 1:16"},
  {t:"Blessed is the one who trusts in the Lord, whose confidence is in Him.",r:"Jeremiah 17:7"},
  {t:"Every good and perfect gift is from above, coming down from the Father of the heavenly lights, who does not change like shifting shadows.",r:"James 1:17"},
  {t:"How abundant are the good things that You have stored up for those who fear You.",r:"Psalm 31:19"},
  {t:"Taste and see that the Lord is good; blessed is the one who takes refuge in Him.",r:"Psalm 34:8"},

/* ════════════════════════════════════════════════════
   AMBIENT BACKGROUND SETUP
   ════════════════════════════════════════════════════ */
(function setupAmbient(){
  const amb = document.getElementById('ambient');
  // orbs
  const orbDefs = [
    {w:420,h:420,left:'10%',top:'5%',tx:'30px',ty:'40px',d:'8s'},
    {w:320,h:320,left:'65%',top:'15%',tx:'-25px',ty:'30px',d:'11s'},
    {w:260,h:260,left:'40%',top:'55%',tx:'20px',ty:'-30px',d:'9s'},
  ];
  orbDefs.forEach(o=>{
    const d=document.createElement('div');
    d.className='amb-orb';
    d.style.cssText=`width:${o.w}px;height:${o.h}px;left:${o.left};top:${o.top};--tx:${o.tx};--ty:${o.ty};--d:${o.d};`;
    amb.appendChild(d);
  });
  // cross symbols
  for(let i=0;i<10;i++){
    const c=document.createElement('div');
    c.className='cross-bg';c.textContent='✝';
    c.style.cssText=`left:${Math.random()*88}%;top:${Math.random()*88}%;--fs:${70+Math.random()*90}px;--r0:${(Math.random()-.5)*18}deg;--r1:${(Math.random()-.5)*18}deg;--d:${5+Math.random()*7}s;`;
    amb.appendChild(c);
  }
})();

const BAL_COLORS=[
  'rgba(201,168,76,0.55)','rgba(184,104,128,0.55)',
  'rgba(74,127,165,0.55)','rgba(90,144,112,0.55)',
  'rgba(160,112,48,0.55)','rgba(112,96,160,0.55)',
];
function spawnBalloons(){
  const layer=document.getElementById('balloons');
  layer.innerHTML='';
  for(let i=0;i<9;i++){
    const bc=BAL_COLORS[i%BAL_COLORS.length];
    const b=document.createElement('div');
    b.className='bal';
    b.style.cssText=`left:${4+i*11}%;--dur:${10+Math.random()*8}s;--del:${Math.random()*6}s;--sw:${(Math.random()-.5)*28}px;`;
    b.innerHTML=`<div class="bal-b" style="--bc:${bc};background:${bc};"></div><div class="bal-s"></div>`;
    layer.appendChild(b);
  }
}
spawnBalloons();

function buildCandles(){
  const row=document.getElementById('candles');
  row.innerHTML='';
  const n=3+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const c=CANDLE_COLORS[i%CANDLE_COLORS.length];
    row.innerHTML+=`<div class="candle-w">
      <div class="flame" style="--fs:${0.55+Math.random()*.6}s"></div>
      <div class="candle-b" style="--cc:${c};background:${c}"></div>
      <div class="candle-base"></div>
    </div>`;
  }
}

    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    inp.style.borderColor='#c06060';
    setTimeout(()=>inp.style.borderColor='',1600);
    return;
  }
  personName=name;

  // pick unused verse
  if(usedVerses.length>=VERSES.length) usedVerses=[];
  let idx;
  do{idx=Math.floor(Math.random()*VERSES.length);}
  while(usedVerses.includes(idx));
  usedVerses.push(idx);
  const v=VERSES[idx];

  const blessing=BLESSINGS[Math.floor(Math.random()*BLESSINGS.length)](name);
  const closing=CLOSINGS[Math.floor(Math.random()*CLOSINGS.length)](name);

  document.getElementById('bTitle').textContent=`🎉 Happy Birthday, ${name}! 🎂`;
  document.getElementById('bBody').innerHTML=blessing;
  document.getElementById('vText').innerHTML=`"${v.t}"`;
  document.getElementById('vRef').textContent=`— ${v.r}`;
  document.getElementById('bClosing').textContent=closing;

  buildCandles();

  // plain text for copy/share/download
  plainText=`🎉 Happy Birthday, ${name}! 🎂\n\n`
    +document.getElementById('bBody').innerText+'\n\n'
    +`📖 ${v.r}\n"${v.t}"\n\n`
    +closing;

  // show card
  const card=document.getElementById('card');
  card.classList.add('open');
  card.classList.remove('shown');
  void card.offsetWidth;
  requestAnimationFrame(()=>card.classList.add('shown'));
  card.scrollIntoView({behavior:'smooth',block:'nearest'});

  launchConfetti();
  spawnBalloons();
}

/* ════════════════════════════════════════════════════
   CONFETTI
   ════════════════════════════════════════════════════ */
const canvas=document.getElementById('conf');
const ctx=canvas.getContext('2d');
let pieces=[];let raf=null;
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

const CONF_COLORS=['#c9a84c','#e8d5a0','#b86880','#4a7fa5','#5a9070','#f0dfa0','#c06040','#d4af60'];
const CONF_SHAPES=['rect','circle','cross','diamond'];

function launchConfetti(){
  pieces=[];
  for(let i=0;i<200;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:-10-Math.random()*200,
      w:5+Math.random()*11,h:3+Math.random()*5,
      color:CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
      angle:Math.random()*Math.PI*2,
      spin:(Math.random()-.5)*.13,
      vx:(Math.random()-.5)*2.8,
      vy:1.5+Math.random()*3.8,
      shape:CONF_SHAPES[Math.floor(Math.random()*CONF_SHAPES.length)],
    });
  }
  if(raf)cancelAnimationFrame(raf);
  animConf();
}
function animConf(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let alive=false;
  pieces.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.055;p.angle+=p.spin;
    if(p.y<canvas.height){
      alive=true;
      const fade=p.y>canvas.height*.75?1-(p.y-canvas.height*.75)/(canvas.height*.25):1;
      ctx.save();
      ctx.globalAlpha=Math.max(0,fade);
      ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.fillStyle=p.color;
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill();}
      else if(p.shape==='cross'){ctx.fillRect(-p.w/2,-p.h/3,p.w,p.h/2);ctx.fillRect(-p.h/3,-p.w/2,p.h/2,p.w);}
      else if(p.shape==='diamond'){ctx.beginPath();ctx.moveTo(0,-p.w/2);ctx.lineTo(p.w/3,0);ctx.lineTo(0,p.w/2);ctx.lineTo(-p.w/3,0);ctx.closePath();ctx.fill();}
      else{ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
      ctx.restore();
    }
  });
  if(alive)raf=requestAnimationFrame(animConf);
  else ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* ════════════════════════════════════════════════════
   THEME TOGGLE
   ════════════════════════════════════════════════════ */
function toggleTheme(){
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('themeIco').textContent=isDark?'☀️':'🌙';
  document.getElementById('themeTxt').textContent=isDark?'Light Mode':'Dark Mode';
}

/* ════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ════════════════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════════════════ */
function copyCard(){
  if(!plainText){toast('⚠️ Generate a blessing first!');return;}
  navigator.clipboard.writeText(plainText).then(()=>toast('✅ Blessing copied to clipboard!'));
}
function shareCard(){
  if(!plainText){toast('⚠️ Generate a blessing first!');return;}
  if(navigator.share){
    navigator.share({title:`Happy Birthday ${personName}!`,text:plainText}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(plainText).then(()=>toast('📋 Copied — paste to share!'));
  }
}
function downloadCard(){
  if(!plainText){toast('⚠️ Generate a blessing first!');return;}
  const content=
`╔══════════════════════════════════════════╗
      ✝  Christian Birthday Blessing  ✝
╚══════════════════════════════════════════╝

${plainText}

══════════════════════════════════════════
     Sent with love and faith in Christ
══════════════════════════════════════════`;
  const blob=new Blob([content],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`birthday-blessing-${personName.replace(/\s+/g,'-').toLowerCase()}.txt`;
  a.click();URL.revokeObjectURL(a.href);
  toast('⬇️ Blessing downloaded!');
}
</script>
