<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christian Birthday Blessing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9973a;
    --gold-light: #e8c46a;
    --gold-dark: #8a6420;
    --cream: #fdf6ec;
    --cream-deep: #f5e8d0;
    --parchment: #ede0c4;
    --ink: #2c1f0e;
    --ink-soft: #5a4228;
    --burgundy: #7b2d42;
    --sage: #4a7c59;
    --sky: #3a6b8a;
    --rose: #c9697a;
    --bg: var(--cream);
    --card-bg: rgba(255,255,255,0.92);
    --text: var(--ink);
    --text-soft: var(--ink-soft);
    --border: rgba(201,151,58,0.25);
    --shadow: rgba(44,31,14,0.12);
    --input-bg: rgba(253,246,236,0.9);
  }
  [data-theme="dark"] {
    --bg: #1a1108;
    --card-bg: rgba(30,20,8,0.96);
    --text: #f5e8d0;
    --text-soft: #c9b08a;
    --border: rgba(201,151,58,0.3);
    --shadow: rgba(0,0,0,0.4);
    --input-bg: rgba(40,28,10,0.9);
    --cream: #1a1108;
    --parchment: #2c1f0e;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.4s, color 0.4s;
    overflow-x: hidden;
  }

  /* ── Background canvas ── */
  #bg-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.55;
  }

  /* ── Confetti canvas ── */
  #confetti-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
  }

  /* ── Layout ── */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1.2rem 4rem;
  }

  /* ── Theme toggle ── */
  .theme-toggle {
    position: fixed; top: 1.2rem; right: 1.2rem; z-index: 200;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    color: var(--gold);
    box-shadow: 0 2px 12px var(--shadow);
    transition: all 0.3s;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .theme-toggle:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--shadow); }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.9s ease both;
  }
  .cross-ornament {
    font-size: 2.2rem;
    color: var(--gold);
    display: block;
    margin-bottom: 0.5rem;
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 8px rgba(201,151,58,0.3); }
    50% { text-shadow: 0 0 24px rgba(201,151,58,0.7), 0 0 40px rgba(201,151,58,0.3); }
  }
  .title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .subtitle {
    font-size: 1.1rem;
    color: var(--text-soft);
    margin-top: 0.4rem;
    font-style: italic;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
  .ornament-line {
    display: flex; align-items: center; justify-content: center;
    gap: 0.8rem; margin: 1rem auto 0;
    color: var(--gold);
    opacity: 0.7;
  }
  .ornament-line::before, .ornament-line::after {
    content: ''; flex: 1; max-width: 120px;
    height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.5rem 2.2rem;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 8px 48px var(--shadow), 0 1px 0 rgba(255,255,255,0.6) inset;
    backdrop-filter: blur(12px);
    animation: fadeUp 0.9s 0.2s ease both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--burgundy), var(--gold), var(--gold-light), var(--gold), var(--sage));
  }

  /* ── Input area ── */
  .input-label {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--gold-dark);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: block;
  }
  .input-row {
    display: flex; gap: 0.8rem;
    margin-bottom: 1.6rem;
  }
  .name-input {
    flex: 1;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .name-input::placeholder { color: var(--text-soft); opacity: 0.6; }
  .name-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,151,58,0.15);
  }
  .generate-btn {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0.85rem 1.5rem;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(138,100,32,0.35);
  }
  .generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(138,100,32,0.45);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
  }
  .generate-btn:active { transform: translateY(0); }

  /* ── Blessing output ── */
  #blessing-output {
    display: none;
    animation: fadeUp 0.7s ease both;
  }
  .blessing-divider {
    display: flex; align-items: center; gap: 1rem;
    margin: 0 0 1.8rem;
    color: var(--gold);
  }
  .blessing-divider::before, .blessing-divider::after {
    content: ''; flex: 1;
    height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .birthday-headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    text-align: center;
    color: var(--gold-dark);
    margin-bottom: 0.3rem;
    line-height: 1.3;
  }
  [data-theme="dark"] .birthday-headline { color: var(--gold-light); }

  .blessing-text {
    font-size: 1.1rem;
    font-weight: 300;
    line-height: 1.9;
    color: var(--text);
    text-align: center;
    margin: 1.2rem 0 1.8rem;
    font-style: italic;
  }

  /* ── Verse card ── */
  .verse-card {
    background: linear-gradient(135deg, rgba(201,151,58,0.08), rgba(201,151,58,0.04));
    border: 1px solid rgba(201,151,58,0.3);
    border-radius: 16px;
    padding: 1.4rem 1.6rem;
    margin: 1.4rem 0;
    position: relative;
  }
  .verse-card::before {
    content: '\201C';
    position: absolute; top: -0.4rem; left: 1rem;
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    color: var(--gold);
    opacity: 0.35;
    line-height: 1;
  }
  .verse-text {
    font-size: 1.05rem;
    line-height: 1.85;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    padding-left: 0.5rem;
  }
  .verse-ref {
    display: block;
    text-align: right;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: var(--gold-dark);
    margin-top: 0.8rem;
    font-style: normal;
  }
  [data-theme="dark"] .verse-ref { color: var(--gold-light); }

  /* ── Action buttons ── */
  .action-row {
    display: flex; flex-wrap: wrap; gap: 0.7rem;
    justify-content: center;
    margin-top: 1.6rem;
  }
  .action-btn {
    display: flex; align-items: center; gap: 0.45rem;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 0.6rem 1.2rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.3s;
  }
  .action-btn:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    background: rgba(201,151,58,0.08);
    transform: translateY(-1px);
  }
  [data-theme="dark"] .action-btn:hover { color: var(--gold-light); }
  .action-btn svg { width: 15px; height: 15px; }

  /* ── Floating balloons ── */
  .balloons-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .balloon {
    position: absolute;
    bottom: -120px;
    font-size: 2.2rem;
    animation: floatUp linear infinite;
    opacity: 0.55;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.1));
  }
  @keyframes floatUp {
    0% { transform: translateX(0) rotate(-5deg); opacity: 0; }
    10% { opacity: 0.55; }
    50% { transform: translateX(20px) rotate(5deg); }
    90% { opacity: 0.55; }
    100% { transform: translateX(-10px) rotate(-3deg) translateY(-110vh); opacity: 0; }
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(4rem);
    background: var(--ink);
    color: var(--cream);
    padding: 0.7rem 1.6rem;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Download card ── */
  #download-card {
    position: fixed; left: -9999px; top: 0;
    width: 900px; padding: 60px;
    background: #fdf6ec;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #2c1f0e;
  }

  /* ── Animations ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Footer ── */
  .footer {
    margin-top: 3rem;
    text-align: center;
    font-size: 0.88rem;
    color: var(--text-soft);
    opacity: 0.6;
    font-style: italic;
    animation: fadeUp 1s 0.5s ease both;
  }

  /* ── Mobile ── */
  @media (max-width: 520px) {
    .input-row { flex-direction: column; }
    .card { padding: 1.8rem 1.3rem; }
    .action-row { gap: 0.5rem; }
    .action-btn { font-size: 0.88rem; padding: 0.55rem 1rem; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div class="balloons-layer" id="balloons-layer"></div>

<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <span id="theme-icon">🌙</span> <span id="theme-label">Dark Mode</span>
</button>

<div class="page">
  <header class="header">
    <span class="cross-ornament">✝</span>
    <h1 class="title">Birthday Blessing</h1>
    <p class="subtitle">A sacred gift of words, wrapped in grace</p>
    <div class="ornament-line">✦ ✦ ✦</div>
  </header>

  <main class="card" id="main-card">
    <label class="input-label" for="name-input">Enter the birthday person's name</label>
    <div class="input-row">
      <input class="name-input" id="name-input" type="text" placeholder="e.g. Sarah, beloved of God…" maxlength="60" autocomplete="off">
      <button class="generate-btn" onclick="generateBlessing()">🕊 Bless</button>
    </div>

    <div id="blessing-output">
      <div class="blessing-divider">🎂</div>
      <h2 class="birthday-headline" id="headline-text"></h2>

      <p class="blessing-text" id="blessing-body"></p>

      <div class="verse-card">
        <p class="verse-text" id="verse-text"></p>
        <span class="verse-ref" id="verse-ref"></span>
      </div>

      <div class="action-row">
        <button class="action-btn" onclick="copyBlessing()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy Blessing
        </button>
        <button class="action-btn" onclick="shareBlessing()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share
        </button>
        <button class="action-btn" onclick="downloadCard()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Card
        </button>
        <button class="action-btn" onclick="generateBlessing()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          New Blessing
        </button>
      </div>
    </div>
  </main>

  <footer class="footer">
    "For I know the plans I have for you," declares the Lord — Jeremiah 29:11
  </footer>
</div>

<!-- Hidden download card -->
<div id="download-card"></div>

<div class="toast" id="toast"></div>

// ── State ────────────────────────────────────────────────────────────────────
let currentBlessing = '';
let currentName = '';
let isDark = false;

// ── Generate ─────────────────────────────────────────────────────────────────
function generateBlessing() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) {
    showToast('Please enter a name first ✨');
    document.getElementById('name-input').focus();
    return;
  }
  currentName = name;

  const template = blessingTemplates[Math.floor(Math.random() * blessingTemplates.length)];
  const closing = closings[Math.floor(Math.random() * closings.length)];
  const verse = verses[Math.floor(Math.random() * verses.length)];
  const blessing = template(name);

  document.getElementById('headline-text').textContent = `🎉 Happy Birthday, ${name}! 🎂`;
  document.getElementById('blessing-body').textContent = blessing + ' ' + closing;
  document.getElementById('verse-text').textContent = verse.text;
  document.getElementById('verse-ref').textContent = '— ' + verse.ref;

  currentBlessing = `🎉 Happy Birthday, ${name}! 🎂\n\n${blessing} ${closing}\n\n"${verse.text}"\n— ${verse.ref}`;

  const output = document.getElementById('blessing-output');
  output.style.display = 'block';
  output.style.animation = 'none';
  requestAnimationFrame(() => {
    output.style.animation = 'fadeUp 0.7s ease both';
  });

  launchConfetti();
  scrollToOutput();
}

function scrollToOutput() {
  setTimeout(() => {
    document.getElementById('blessing-output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function copyBlessing() {
  navigator.clipboard.writeText(currentBlessing)
    .then(() => showToast('Blessing copied to clipboard! ✨'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = currentBlessing;
      document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Blessing copied! ✨');
    });
}

function shareBlessing() {
  if (navigator.share) {
    navigator.share({ title: `Birthday Blessing for ${currentName}`, text: currentBlessing })
      .catch(() => {});
  } else {
    copyBlessing();
    showToast('Link copied — share with someone special! 🎁');
  }
}

function downloadCard() {
  const blessingBody = document.getElementById('blessing-body').textContent;
  const verseText = document.getElementById('verse-text').textContent;
  const verseRef = document.getElementById('verse-ref').textContent;

  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 800;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 1200, 800);
  grad.addColorStop(0, '#fdf6ec');
  grad.addColorStop(0.5, '#f5e8d0');
  grad.addColorStop(1, '#ede0c4');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1200, 800);

  // Gold border
  ctx.strokeStyle = '#c9973a';
  ctx.lineWidth = 6;
  ctx.strokeRect(20, 20, 1160, 760);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(34, 34, 1132, 732);

  // Cross
  ctx.font = 'bold 42px serif';
  ctx.fillStyle = '#c9973a';
  ctx.textAlign = 'center';
  ctx.fillText('✝', 600, 80);

  // Headline
  ctx.font = 'bold 42px Georgia, serif';
  ctx.fillStyle = '#8a6420';
  ctx.fillText(`🎉 Happy Birthday, ${currentName}! 🎂`, 600, 135);

  // Divider line
  ctx.strokeStyle = 'rgba(201,151,58,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(100, 155); ctx.lineTo(1100, 155); ctx.stroke();

  // Blessing body (wrapped)
  ctx.font = 'italic 22px Georgia, serif';
  ctx.fillStyle = '#2c1f0e';
  wrapText(ctx, blessingBody.substring(0, 260) + '...', 100, 200, 1000, 34);

  // Verse box
  ctx.fillStyle = 'rgba(201,151,58,0.1)';
  roundRect(ctx, 80, 520, 1040, 160, 16);
  ctx.fillStyle = 'rgba(201,151,58,0.25)';
  ctx.strokeStyle = 'rgba(201,151,58,0.5)';
  ctx.lineWidth = 1;
  roundRectStroke(ctx, 80, 520, 1040, 160, 16);

  ctx.font = 'italic 20px Georgia, serif';
  ctx.fillStyle = '#2c1f0e';
  wrapText(ctx, '"' + verseText + '"', 110, 556, 980, 30);

  ctx.font = '16px Georgia, serif';
  ctx.fillStyle = '#8a6420';
  ctx.textAlign = 'right';
  ctx.fillText(verseRef, 1100, 668);

  // Footer
  ctx.textAlign = 'center';
  ctx.font = '14px Georgia, serif';
  ctx.fillStyle = '#5a4228';
  ctx.globalAlpha = 0.6;
  ctx.fillText('Generated with love • Christian Birthday Blessing', 600, 766);
  ctx.globalAlpha = 1;

  const link = document.createElement('a');
  link.download = `birthday-blessing-${currentName.replace(/\s+/g, '-').toLowerCase()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Birthday card downloaded! 🎉');
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && i > 0) {
      ctx.fillText(line, x, cy);
      line = words[i] + ' ';
      cy += lineH;
      if (cy > 490) break;
    } else { line = test; }
  }
  ctx.fillText(line, x, cy);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  ctx.fill();
}
function roundRectStroke(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  ctx.stroke();
}

// ── Theme ─────────────────────────────────────────────────────────────────────

  document.getElementById('theme-label').textContent = isDark ? 'Light Mode' : 'Dark Mode';

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {

// ── Confetti ──────────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#c9973a','#e8c46a','#7b2d42','#4a7c59','#3a6b8a','#c9697a','#f5e8d0','#fff'];
  const shapes = ['circle','square','star'];
  const particles = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: -20,
    size: 5 + Math.random() * 8,
    color: colors[Math.floor(Math.random() * colors.length)],
    shape: shapes[Math.floor(Math.random() * shapes.length)],
    vx: (Math.random() - 0.5) * 4,
    vy: 2 + Math.random() * 5,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.2,
    alpha: 1,
  }));

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.rot += p.rotV;
      if (frame > 90) p.alpha -= 0.012;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI*2); ctx.fill();
      } else if (p.shape === 'square') {
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      } else {
        drawStar(ctx, 0, 0, 5, p.size/2, p.size/4);
      }
      ctx.restore();
    });
    frame++;
    if (frame < 200) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}
function drawStar(ctx, cx, cy, spikes, outer, inner) {
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  ctx.lineTo(cx, cy - outer);
  ctx.closePath();
  ctx.fill();
}

// ── Background canvas (subtle cross pattern) ──────────────────────────────────
(function drawBg() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; render(); }
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const theme = document.documentElement.getAttribute('data-theme');
    ctx.strokeStyle = theme === 'dark' ? 'rgba(201,151,58,0.07)' : 'rgba(201,151,58,0.12)';
    ctx.lineWidth = 0.8;
    const spacing = 80;
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(x + spacing/2 - 6, y + spacing/2);
        ctx.lineTo(x + spacing/2 + 6, y + spacing/2);
        ctx.moveTo(x + spacing/2, y + spacing/2 - 8);
        ctx.lineTo(x + spacing/2, y + spacing/2 + 8);
        ctx.stroke();
      }
    }
  }
  window.addEventListener('resize', resize);
  resize();
  // Re-render on theme change
  const observer = new MutationObserver(render);
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();

// ── Floating balloons ─────────────────────────────────────────────────────────
(function spawnBalloons() {
  const layer = document.getElementById('balloons-layer');
  const emojis = ['🎈','🎈','🎉','🎊','🎈','🕊','⭐','🌟','✨'];
  let count = 0;
  function spawn() {
    if (count > 18) return;
    const el = document.createElement('div');
    el.className = 'balloon';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 98 + '%';
    el.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
    const dur = 12 + Math.random() * 16;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * 6) + 's';
    layer.appendChild(el);
    count++;
    el.addEventListener('animationend', () => { el.remove(); count--; setTimeout(spawn, 1000 + Math.random()*3000); });
  }
  for (let i = 0; i < 8; i++) setTimeout(spawn, i * 800);
})();
